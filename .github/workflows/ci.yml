name: CI

on:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies (locked)
        run: pipenv install --dev --deploy
      - name: Lint
        run: pipenv run ruff check .
      - name: Test
        run: pipenv run pytest

  frontend:
    name: Frontend (prettier + vue-tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # corepack activates the pnpm version pinned in the root package.json.
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm --filter web run format:check
      - name: Typecheck
        run: pnpm --filter web run typecheck
      - name: Test
        run: pnpm --filter web run test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build field image
        run: docker build -t howzatt:ci .
